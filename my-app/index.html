<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MySongChart</title>
    
    <!-- Cal Sans Font & Google Fonts (Roboto Mono, Architects Daughter, Caveat, Lora, Jost) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cal-sans@1.0.1/cal-sans.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Roboto+Mono:wght@500;700&family=Jost:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
      /* General UI App Font */
      body, button, input, select, label {
        font-family: 'Cal Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      }

      /* Raw Lyrics Text Area: Monospace Typewriter Font */
      textarea, 
      textarea.lyrics-input, 
      .raw-lyrics-box {
        font-family: 'Courier New', Courier, monospace !important;
        font-size: 0.95rem;
        line-height: 1.5;
      }

      /* PDF Preview Theme Specific Styles */
      .theme-modern {
        font-family: 'Cal Sans', sans-serif !important;
      }

      .theme-classic-studio {
        font-family: 'Roboto Mono', 'Courier New', Courier, monospace !important;
      }

      .theme-real-book {
        font-family: 'Architects Daughter', 'Caveat', cursive !important;
      }

      .theme-elegance {
        font-family: 'Lora', serif !important;
      }

      .theme-minimalist {
        font-family: 'Jost', sans-serif !important;
      }
    </style>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
